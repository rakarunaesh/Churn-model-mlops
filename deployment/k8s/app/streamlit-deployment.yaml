---
apiVersion: v1
kind: ConfigMap
metadata:
  name: streamlit-config
  namespace: churn-model
data:
  # KServe auto-appends "-predictor" to the InferenceService name when
  # creating the backing Service - confirmed via:
  #   kubectl get svc -n churn-model -> churn-predictor-predictor
  API_URL: "http://churn-predictor-predictor.churn-model.svc.cluster.local"
  APP_VERSION: "1.0.0"

---
# Streamlit UI Deployment - calls the churn-predictor KServe InferenceService
apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamlit-app
  namespace: churn-model
  labels:
    app: streamlit-app
    component: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: streamlit-app
  template:
    metadata:
      labels:
        app: streamlit-app
        component: frontend
    spec:
      containers:
        - name: streamlit
          # Replaced by CI (streamlit-ci.yaml) with the git-SHA-tagged image
          # on every build touching streamlit_app/**.
          image: docker.io/rakarun/churn-ui:2d13bf09aaf7421b6500716893252d478059731f
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8501
              protocol: TCP
          envFrom:
            - configMapRef:
                name: streamlit-config
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: "/_stcore/health"
              port: 8501
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: "/_stcore/health"
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2

---
apiVersion: v1
kind: Service
metadata:
  name: streamlit-app
  namespace: churn-model
  labels:
    app: streamlit-app
spec:
  # LoadBalancer instead of ClusterIP + Ingress - this nginx-ingress-controller
  # install requires a host on every Ingress rule, so a host-less "access by
  # any hostname" Ingress gets rejected. A LoadBalancer Service has no
  # host-routing at all, so it works without a domain.
  type: LoadBalancer
  ports:
    - name: http
      port: 80
      targetPort: 8501
      protocol: TCP
  selector:
    app: streamlit-app

# Ingress disabled - this nginx-ingress-controller install (NGINX Inc, not
# the ingress-nginx community project) rejects any rule without a `host`
# ("spec.rules[0].host: Required value"), so a host-less catch-all Ingress
# never gets an address. Using the streamlit-app Service as type: LoadBalancer
# directly instead - no host-routing needed, works without a domain.
#
# To switch back to Ingress once you have a real domain:
# ---
# apiVersion: networking.k8s.io/v1
# kind: Ingress
# metadata:
#   name: streamlit-ingress
#   namespace: churn-model
#   annotations:
#     cert-manager.io/cluster-issuer: letsencrypt-prod  # or zerossl-prod
# spec:
#   ingressClassName: nginx
#   tls:
#     - hosts: ["your-domain.com"]
#       secretName: churn-streamlit-tls
#   rules:
#     - host: your-domain.com
#       http:
#         paths:
#           - path: /
#             pathType: Prefix
#             backend:
#               service:
#                 name: streamlit-app
#                 port:
#                   number: 80

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: streamlit-hpa
  namespace: churn-model
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: streamlit-app
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
