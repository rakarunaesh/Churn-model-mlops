apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: churn-model
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rakarunaesh/Churn-model-mlops
    targetRevision: main
    # Only k8s/app - k8s/infra (github-runner, cluster-issuer, StorageClass)
    # is cluster-wide/CI infra, not part of this app, applied manually instead.
    path: deployment/k8s/app
  destination:
    server: https://kubernetes.default.svc
    namespace: churn-model
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
