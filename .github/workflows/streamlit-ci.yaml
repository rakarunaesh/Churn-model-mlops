name: Streamlit CI

on:
  push:
    branches: [cicd]
    paths:
      - 'streamlit_app/**'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to push the manifest update commit

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./streamlit_app
          push: true
          tags: |
            docker.io/${{ vars.DOCKERHUB_USERNAME }}/churn-ui:latest
            docker.io/${{ vars.DOCKERHUB_USERNAME }}/churn-ui:${{ github.sha }}

      - name: Update streamlit-deployment.yaml with new image tag
        run: |
          NEW_IMAGE="docker.io/${{ vars.DOCKERHUB_USERNAME }}/churn-ui:${{ github.sha }}"
          # Match only the streamlit image line - this file has no other
          # containers, but stay precise in case that changes later.
          sed -i "s|image: .*/churn-ui:.*|image: $NEW_IMAGE|g" k8s/streamlit-deployment.yaml

      - name: Commit updated streamlit-deployment.yaml
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add k8s/streamlit-deployment.yaml
          git commit -m "Update streamlit image tag [skip ci]" || echo "No changes"
          git push || echo "No changes to push"
