---
apiVersion: v1
kind: ConfigMap
metadata:
  name: streamlit-config
  namespace: churn-model
data:
  API_URL: "http://churn-predictor.churn-model.svc.cluster.local"
  APP_VERSION: "1.0.0"

---
# Streamlit UI Deployment - calls the churn-predictor KServe InferenceService
apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamlit-app
  namespace: churn-model
  labels:
    app: streamlit-app
    component: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: streamlit-app
  template:
    metadata:
      labels:
        app: streamlit-app
        component: frontend
    spec:
      containers:
        - name: streamlit
          # Replaced by CI (streamlit-ci.yaml) with the git-SHA-tagged image
          # on every build touching streamlit_app/**.
          image: docker.io/rakarun/churn-ui:2d13bf09aaf7421b6500716893252d478059731f
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8501
              protocol: TCP
          envFrom:
            - configMapRef:
                name: streamlit-config
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: "/_stcore/health"
              port: 8501
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: "/_stcore/health"
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2

---
apiVersion: v1
kind: Service
metadata:
  name: streamlit-app
  namespace: churn-model
  labels:
    app: streamlit-app
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8501
      protocol: TCP
  selector:
    app: streamlit-app

---
# Plain HTTP, no TLS - fine for a demo app with no sensitive data. To add
# TLS back later: re-add the cert-manager.io/cluster-issuer annotation
# (letsencrypt-prod or zerossl-prod - see cluster-issuer*.yaml) and a `tls:`
# block pointing at a Secret name, same as before.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: streamlit-ingress
  namespace: churn-model
spec:
  ingressClassName: nginx
  rules:
    # - host:  churn.karunaesh.2bd.net  # Commented out - access via NLB hostname. Uncomment + set domain to enable custom hostname
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: streamlit-app
                port:
                  number: 80

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: streamlit-hpa
  namespace: churn-model
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: streamlit-app
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
