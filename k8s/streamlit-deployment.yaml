---
# Streamlit UI Deployment - calls the churn-predictor KServe InferenceService
apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamlit-app
  namespace: churn-model
  labels:
    app: streamlit-app
    component: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: streamlit-app
  template:
    metadata:
      labels:
        app: streamlit-app
        component: frontend
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: streamlit
          # Replaced by CI (streamlit-ci.yaml) with the git-SHA-tagged image
          # on every build touching streamlit_app/**.
          image: docker.io/rakarun/churn-ui:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8501
              protocol: TCP
          env:
            - name: API_URL
              value: "http://churn-predictor.churn-model.svc.cluster.local"
            - name: APP_VERSION
              value: "1.0.0"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: "/_stcore/health"
              port: 8501
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: "/_stcore/health"
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2

---
apiVersion: v1
kind: Service
metadata:
  name: streamlit-app
  namespace: churn-model
  labels:
    app: streamlit-app
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8501
      protocol: TCP
  selector:
    app: streamlit-app

---
# Replace churn.yourdomain.com with your real subdomain, same pattern as the
# Streamlit/MLflow ingresses in house-price-predictor - same nginx-ingress
# controller and cert-manager ClusterIssuer.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: streamlit-ingress
  namespace: churn-model
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["churn.yourdomain.com"]
      secretName: churn-streamlit-tls
  rules:
    - host: churn.yourdomain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: streamlit-app
                port:
                  number: 80

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: streamlit-hpa
  namespace: churn-model
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: streamlit-app
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
