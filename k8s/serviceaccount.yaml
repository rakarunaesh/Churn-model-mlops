apiVersion: v1
kind: Namespace
metadata:
  name: churn-model
---
# ServiceAccount for IRSA (IAM Roles for Service Accounts) - gives KServe's
# storage-initializer S3 read access without static AWS keys. Create the
# matching IAM role first (same pattern as mlflow-server-sa in
# deployment/mlflow/k8s):
#
#   eksctl create iamserviceaccount \
#     --name sa-s3-access \
#     --namespace churn-model \
#     --cluster mlops-prod \
#     --attach-policy-arn arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess \
#     --approve
#
# eksctl annotates this ServiceAccount with the role ARN automatically if you
# let it create the ServiceAccount too - in that case skip applying the block
# below, or run eksctl with --override-existing-serviceaccounts.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-s3-access
  namespace: churn-model
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::<ACCOUNT_ID>:role/<ROLE_NAME_FROM_EKSCTL>"
